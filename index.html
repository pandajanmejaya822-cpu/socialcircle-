<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SocialCircle</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #151922;
      --card-2: #1d222e;
      --border: #262c3a;
      --text: #f3f5f8;
      --muted: #949eb3;
      --accent: #6366f1;
      --accent-2: #ec4899;
      --danger: #f43f5e;
      --success: #10b981;
      --grad: linear-gradient(135deg, #f59e0b, #ec4899, #6366f1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 76px;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      position: relative;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.4px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1rem;
      cursor: pointer;
    }

    .badge-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 99px;
      background: var(--danger);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      display: none;
      place-items: center;
    }

    .badge-dot.show { display: grid; }

    /* Stories */
    .stories-wrap {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .stories-wrap::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 66px;
      cursor: pointer;
    }

    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 2.5px;
      background: var(--grad);
      position: relative;
    }

    .story-ring.add-ring { background: var(--border); }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--card-2);
      border: 2px solid var(--bg);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      overflow: hidden;
      object-fit: cover;
    }

    .story-plus {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: grid;
      place-items: center;
      border: 2px solid var(--bg);
    }

    .story-name {
      font-size: 0.72rem;
      color: var(--muted);
      max-width: 66px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Composer */
    .composer {
      margin: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .composer-top {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .avatar-sm {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--grad);
      display: grid;
      place-items: center;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
    }

    .composer textarea {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      resize: none;
      min-height: 58px;
      outline: none;
      font-family: inherit;
    }

    .preview-box {
      margin-top: 10px;
      position: relative;
      display: none;
    }

    .preview-box img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .remove-img {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .media-btns {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .post-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    /* Filter & Feed */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 4px 12px 10px;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 12px 16px;
    }

    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
    }

    .post-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-meta h4 { font-size: 0.92rem; font-weight: 600; }
    .post-meta span { font-size: 0.75rem; color: var(--muted); }

    .dm-mini-btn {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 14px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .post-text {
      padding: 0 14px 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .post-media {
      position: relative;
      background: #000;
    }

    .post-media img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
    }

    .heart-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 72px;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
    }

    .heart-burst.show {
      transform: translate(-50%, -50%) scale(1.1);
      opacity: 1;
    }

    .post-stats {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 4px;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 10px 6px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 10px;
    }

    .action-btn.liked { color: var(--danger); }
    .action-btn.saved { color: #f59e0b; }

    .comments-box {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border);
      background: var(--card-2);
      display: none;
    }

    .comments-box.open { display: block; }

    .comment-item {
      font-size: 0.84rem;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .comment-item strong {
      color: var(--text);
      margin-right: 6px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .comment-form input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
    }

    /* Individual Chats List & Thread */
    .chat-header-bar {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .new-chat-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .new-chat-row input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
    }

    .chat-thread-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .chat-thread-item:active { background: var(--card); }

    .chat-thread-info {
      flex: 1;
      min-width: 0;
    }

    .chat-thread-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .chat-thread-top strong { font-size: 0.94rem; }
    .chat-thread-top span { font-size: 0.72rem; color: var(--muted); }

    .chat-last-msg {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-pill {
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
    }

    /* Fullscreen 1-on-1 Chat Room */
    .dm-room {
      position: fixed;
      inset: 0;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      z-index: 55;
      display: none;
      flex-direction: column;
    }

    .dm-room.open { display: flex; }

    .dm-room-header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .dm-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.38;
      word-wrap: break-word;
    }

    .msg-bubble.me {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble.them {
      align-self: flex-start;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      font-size: 0.68rem;
      opacity: 0.8;
      margin-top: 4px;
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    .dm-input-bar {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dm-input-bar input {
      flex: 1;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    /* Profile */
    .profile-card {
      margin: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
    }

    .avatar-lg {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: var(--grad);
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      font-weight: 800;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin: 16px 0;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .profile-stats div strong { display: block; font-size: 1.1rem; }
    .profile-stats div span { font-size: 0.76rem; color: var(--muted); }

    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-top: 12px;
    }

    .edit-form input {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(11, 13, 18, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 0 10px;
      z-index: 40;
    }

    .nav-btn {
      position: relative;
      background: none;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .nav-btn.active { color: var(--text); font-weight: 600; }
    .nav-btn span.ico { font-size: 1.2rem; }

    /* Story Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 60;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .modal.open { display: flex; }

    .story-bar-bg {
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .story-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.1s linear;
    }

    .story-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }

    .story-body img {
      max-width: 100%;
      max-height: 62vh;
      border-radius: 16px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">SocialCircle</div>
      <div class="top-actions">
        <button class="icon-btn" onclick="openStoryUpload()" title="Add Story">+</button>
        <button class="icon-btn" onclick="switchTab('chats')" title="Chats">
          💬
          <span class="badge-dot" id="topChatBadge">0</span>
        </button>
      </div>
    </header>

    <!-- HOME TAB -->
    <main id="tab-home">
      <section class="stories-wrap" id="storiesBar"></section>

      <section class="composer">
        <div class="composer-top">
          <div class="avatar-sm" id="composerAvatar">Y</div>
          <textarea id="postInput" placeholder="What's on your mind?"></textarea>
        </div>
        <div class="preview-box" id="previewBox">
          <img id="previewImg" alt="Preview" />
          <button class="remove-img" onclick="clearImage()">✕</button>
        </div>
        <div class="composer-actions">
          <div class="media-btns">
            <label class="pill-btn">
              📷 Photo
              <input type="file" id="imageInput" accept="image/*" hidden onchange="handleImageSelect(event)" />
            </label>
            <button class="pill-btn" type="button" onclick="toggleMood()">😊 <span id="moodLabel">Chill</span></button>
          </div>
          <button class="post-btn" onclick="createPost()">Post</button>
        </div>
      </section>

      <div class="filter-bar">
        <button class="filter-chip active" onclick="setFilter('all', this)">All Posts</button>
        <button class="filter-chip" onclick="setFilter('photos', this)">Photos</button>
        <button class="filter-chip" onclick="setFilter('saved', this)">Saved</button>
      </div>

      <section class="feed" id="feedContainer"></section>
    </main>

    <!-- CHATS LIST TAB -->
    <main id="tab-chats" class="hidden">
      <div class="chat-header-bar">
        <strong>Messages</strong>
        <span style="font-size:0.78rem;color:var(--muted);">1-on-1 Chats</span>
      </div>
      <div class="new-chat-row">
        <input type="text" id="newChatName" placeholder="Start chat with someone (name)..." />
        <button class="post-btn" onclick="startNewChat()">Start</button>
      </div>
      <div class="chat-list" id="chatListContainer"></div>
    </main>

    <!-- SAVED TAB -->
    <main id="tab-saved" class="hidden">
      <div style="padding:14px 16px 6px;font-weight:700;font-size:1.05rem;">Saved Posts</div>
      <section class="feed" id="savedContainer"></section>
    </main>

    <!-- PROFILE TAB -->
    <main id="tab-profile" class="hidden">
      <div class="profile-card">
        <div class="avatar-lg" id="profileAvatar">Y</div>
        <h2 id="profileDisplayName">You</h2>
        <p id="profileHandle" style="color:var(--muted);font-size:0.86rem;">@you</p>
        <p id="profileBio" style="margin-top:8px;font-size:0.9rem;">Building cool apps from my phone 🚀</p>

        <div class="profile-stats">
          <div><strong id="statPosts">0</strong><span>Posts</span></div>
          <div><strong id="statLikes">0</strong><span>Likes</span></div>
          <div><strong id="statSaved">0</strong><span>Saved</span></div>
        </div>

        <div class="edit-form">
          <input type="text" id="editName" placeholder="Your Name" />
          <input type="text" id="editHandle" placeholder="@username" />
          <input type="text" id="editBio" placeholder="Short bio" />
          <button class="post-btn" style="width:100%;padding:11px;" onclick="saveProfile()">Save Profile</button>
        </div>
      </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
        <span class="ico">🏠</span><span>Home</span>
      </button>
      <button class="nav-btn" id="nav-chats" onclick="switchTab('chats')">
        <span class="ico">💬</span><span>Chats</span>
      </button>
      <button class="nav-btn" id="nav-saved" onclick="switchTab('saved')">
        <span class="ico">🔖</span><span>Saved</span>
      </button>
      <button class="nav-btn" id="nav-profile" onclick="switchTab('profile')">
        <span class="ico">👤</span><span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- INDIVIDUAL 1-ON-1 CHAT ROOM -->
  <div class="dm-room" id="dmRoom">
    <div class="dm-room-header">
      <button class="back-btn" onclick="closeDmRoom()">← Back</button>
      <div class="avatar-sm" id="dmPeerAvatar" style="width:36px;height:36px;font-size:0.95rem;">A</div>
      <div>
        <div style="font-weight:700;font-size:0.95rem;" id="dmPeerName">Friend</div>
        <div style="font-size:0.72rem;color:var(--success);">● Active</div>
      </div>
    </div>
    <div class="dm-messages" id="dmMessagesBox"></div>
    <form class="dm-input-bar" onsubmit="sendDmMessage(event)">
      <input type="text" id="dmInput" placeholder="Message..." autocomplete="off" />
      <button class="post-btn" type="submit">Send</button>
    </form>
  </div>

  <input type="file" id="storyFileInput" accept="image/*" hidden onchange="handleStoryUpload(event)" />

  <div class="modal" id="storyModal" onclick="closeStory()">
    <div>
      <div class="story-bar-bg"><div class="story-bar-fill" id="storyProgress"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong id="storyUserLabel">Story</strong>
        <span style="font-size:1.2rem;cursor:pointer;">✕</span>
      </div>
    </div>
    <div class="story-body" id="storyContent"></div>
    <div style="text-align:center;color:var(--muted);font-size:0.8rem;">Tap anywhere to close</div>
  </div>
  <script>
    const STORAGE_KEY = "socialcircle_full_v1";
    const MOODS = ["Chill", "Excited 🔥", "Coding 💻", "Vibing 🎧", "Outdoors 🌿"];
    let moodIndex = 0;
    let selectedImageData = "";
    let currentFilter = "all";
    let activeChatId = null;
    let storyTimer = null;

    const defaultState = {
      profile: {
        name: "You",
        handle: "@you",
        bio: "Building cool apps from my phone 🚀"
      },
      stories: [
        { id: 1, name: "Aarav", text: "Late night coding session ☕💻", image: "" },
        { id: 2, name: "Priya", text: "Evening sky view ✨", image: "" }
      ],
      posts: [
        {
          id: 101,
          author: "Aarav",
          handle: "@aarav",
          time: "2h ago",
          mood: "Excited 🔥",
          text: "Welcome to SocialCircle! Tap Message to chat 1-on-1 or drop a post below.",
          image: "",
          likes: 4,
          liked: false,
          saved: false,
          comments: [{ user: "Priya", text: "Love the 1-on-1 chat!" }]
        }
      ],
      chats: [
        {
          id: "aarav",
          peer: "Aarav",
          unread: 1,
          messages: [
            { id: 1, from: "them", text: "Hey! Did you push the app to GitHub Pages?", time: "9:15 AM" }
          ]
        },
        {
          id: "priya",
          peer: "Priya",
          unread: 0,
          messages: [
            { id: 1, from: "them", text: "Your new social feed looks super clean!", time: "Yesterday" }
          ]
        }
      ]
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function nowTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function toggleMood() {
      moodIndex = (moodIndex + 1) % MOODS.length;
      document.getElementById("moodLabel").textContent = MOODS[moodIndex];
    }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        selectedImageData = ev.target.result;
        document.getElementById("previewImg").src = selectedImageData;
        document.getElementById("previewBox").style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedImageData = "";
      document.getElementById("imageInput").value = "";
      document.getElementById("previewBox").style.display = "none";
    }

    function createPost() {
      const text = document.getElementById("postInput").value.trim();
      if (!text && !selectedImageData) return;

      state.posts.unshift({
        id: Date.now(),
        author: state.profile.name,
        handle: state.profile.handle,
        time: "Just now",
        mood: MOODS[moodIndex],
        text,
        image: selectedImageData,
        likes: 0,
        liked: false,
        saved: false,
        comments: []
      });

      document.getElementById("postInput").value = "";
      clearImage();
      saveState();
      renderAll();
    }

    function toggleLike(id, fromDoubleTap = false) {
      const post = state.posts.find(p => p.id === id);
      if (!post) return;
      if (fromDoubleTap) {
        if (!post.liked) {
          post.liked = true;
          post.likes++;
        }
        const burst = document.getElementById("burst-" + id);
        if (burst) {
          burst.classList.add("show");
          setTimeout(() => burst.classList.remove("show"), 550);
        }
      } else {
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;
      }
      saveState();
      renderAll();
    }

    function toggleSave(id) {
      const post = state.posts.find(p => p.id === id);
      if (!post) return;
      post.saved = !post.saved;
      saveState();
      renderAll();
    }

    function toggleComments(id) {
      const box = document.getElementById("comments-" + id);
      if (box) box.classList.toggle("open");
    }

    function addComment(e, id) {
      e.preventDefault();
      const input = document.getElementById("cinput-" + id);
      const val = input.value.trim();
      if (!val) return;
      const post = state.posts.find(p => p.id === id);
      post.comments.push({ user: state.profile.name, text: val });
      input.value = "";
      saveState();
      renderAll();
      document.getElementById("comments-" + id)?.classList.add("open");
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      renderFeed();
    }

    /* 1-on-1 Chat Functions */
    function openChatWith(peerName) {
      const cleanName = peerName.trim();
      if (!cleanName) return;
      const slug = cleanName.toLowerCase().replace(/[^a-z0-9]+/g, "_");
      let chat = state.chats.find(c => c.id === slug || c.peer.toLowerCase() === cleanName.toLowerCase());

      if (!chat) {
        chat = {
          id: slug + "_" + Date.now(),
          peer: cleanName,
          unread: 0,
          messages: []
        };
        state.chats.unshift(chat);
      }

      chat.unread = 0;
      activeChatId = chat.id;
      saveState();
      renderChatBadge();
      renderChatList();
      renderDmRoom();
      document.getElementById("dmRoom").classList.add("open");
      setTimeout(() => document.getElementById("dmInput")?.focus(), 80);
    }

    function startNewChat() {
      const input = document.getElementById("newChatName");
      const name = input.value.trim();
      if (!name) return;
      input.value = "";
      openChatWith(name);
    }

    function closeDmRoom() {
      activeChatId = null;
      document.getElementById("dmRoom").classList.remove("open");
      renderChatList();
      renderChatBadge();
    }

    function sendDmMessage(e) {
      e.preventDefault();
      if (!activeChatId) return;
      const input = document.getElementById("dmInput");
      const text = input.value.trim();
      if (!text) return;

      const chat = state.chats.find(c => c.id === activeChatId);
      if (!chat) return;

      chat.messages.push({
        id: Date.now(),
        from: "me",
        text,
        time: nowTime()
      });
      input.value = "";
      saveState();
      renderDmRoom();
      renderChatList();
    }

    function renderDmRoom() {
      const chat = state.chats.find(c => c.id === activeChatId);
      if (!chat) return;
      document.getElementById("dmPeerName").textContent = chat.peer;
      document.getElementById("dmPeerAvatar").textContent = chat.peer.charAt(0).toUpperCase();

      const box = document.getElementById("dmMessagesBox");
      if (!chat.messages.length) {
        box.innerHTML = `<div style="text-align:center;color:var(--muted);margin-top:30px;font-size:0.85rem;">Say hi to ${chat.peer} 👋</div>`;
        return;
      }

      box.innerHTML = chat.messages
        .map(m => `
          <div class="msg-bubble ${m.from}">
            <div>${m.text}</div>
            <div class="msg-meta">${m.time}${m.from === "me" ? " · ✓✓" : ""}</div>
          </div>
        `)
        .join("");
      box.scrollTop = box.scrollHeight;
    }

    function renderChatList() {
      const container = document.getElementById("chatListContainer");
      if (!state.chats.length) {
        container.innerHTML = `<div style="text-align:center;color:var(--muted);padding:30px;">No individual chats yet.</div>`;
        return;
      }

      container.innerHTML = state.chats
        .map(c => {
          const last = c.messages[c.messages.length - 1];
          const preview = last ? (last.from === "me" ? "You: " + last.text : last.text) : "Start a conversation";
          const timeStr = last ? last.time : "";
          return `
            <div class="chat-thread-item" onclick="openChatWith('${c.peer.replace(/'/g, "\\'")}')">
              <div class="avatar-sm">${c.peer.charAt(0).toUpperCase()}</div>
              <div class="chat-thread-info">
                <div class="chat-thread-top">
                  <strong>${c.peer}</strong>
                  <span>${timeStr}</span>
                </div>
                <div class="chat-last-msg">${preview}</div>
              </div>
              ${c.unread > 0 ? `<span class="unread-pill">${c.unread}</span>` : ""}
            </div>
          `;
        })
        .join("");
    }

    function renderChatBadge() {
      const totalUnread = state.chats.reduce((sum, c) => sum + (c.unread || 0), 0);
      const badge = document.getElementById("topChatBadge");
      badge.textContent = totalUnread;
      badge.classList.toggle("show", totalUnread > 0);
    }

    /* Stories */
    function renderStories() {
      const bar = document.getElementById("storiesBar");
      const initial = state.profile.name.charAt(0).toUpperCase();
      let html = `
        <div class="story-item" onclick="openStoryUpload()">
          <div class="story-ring add-ring">
            <div class="story-avatar">${initial}</div>
            <div class="story-plus">+</div>
          </div>
          <span class="story-name">Your Story</span>
        </div>
      `;

      state.stories.forEach(s => {
        const avatarHtml = s.image
          ? `<img class="story-avatar" src="${s.image}" alt="${s.name}" />`
          : `<div class="story-avatar">${s.name.charAt(0).toUpperCase()}</div>`;
        html += `
          <div class="story-item" onclick="viewStory(${s.id})">
            <div class="story-ring">${avatarHtml}</div>
            <span class="story-name">${s.name}</span>
          </div>
        `;
      });
      bar.innerHTML = html;
    }

    function openStoryUpload() {
      document.getElementById("storyFileInput").click();
    }

    function handleStoryUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        state.stories.unshift({
          id: Date.now(),
          name: state.profile.name,
          text: "",
          image: ev.target.result
        });
        saveState();
        renderStories();
      };
      reader.readAsDataURL(file);
    }

    function viewStory(id) {
      const story = state.stories.find(s => s.id === id);
      if (!story) return;
      document.getElementById("storyUserLabel").textContent = story.name;
      document.getElementById("storyContent").innerHTML = story.image
        ? `<img src="${story.image}" alt="Story" />`
        : `<p style="font-size:1.3rem;padding:20px;">${story.text}</p>`;

      const modal = document.getElementById("storyModal");
      const bar = document.getElementById("storyProgress");
      modal.classList.add("open");
      bar.style.width = "0%";

      let pct = 0;
      clearInterval(storyTimer);
      storyTimer = setInterval(() => {
        pct += 2.5;
        bar.style.width = pct + "%";
        if (pct >= 100) closeStory();
      }, 100);
    }

    function closeStory() {
      clearInterval(storyTimer);
      document.getElementById("storyModal").classList.remove("open");
    }

    /* Posts & Profile */
    function buildPostHTML(p) {
      const initial = p.author.charAt(0).toUpperCase();
      const mediaHTML = p.image
        ? `<div class="post-media" ondblclick="toggleLike(${p.id}, true)">
             <img src="${p.image}" alt="Post image" />
             <div class="heart-burst" id="burst-${p.id}">❤️</div>
           </div>`
        : "";

      const commentsHTML = p.comments
        .map(c => `<div class="comment-item"><strong>${c.user}</strong>${c.text}</div>`)
        .join("");

      const safeAuthor = p.author.replace(/'/g, "\\'");

      return `
        <article class="post-card">
          <div class="post-header">
            <div class="post-user">
              <div class="avatar-sm">${initial}</div>
              <div class="post-meta">
                <h4>${p.author} <span style="font-weight:400;">• ${p.mood}</span></h4>
                <span>${p.handle} · ${p.time}</span>
              </div>
            </div>
            <button class="dm-mini-btn" onclick="openChatWith('${safeAuthor}')">💬 Chat</button>
          </div>
          ${p.text ? `<div class="post-text">${p.text}</div>` : ""}
          ${mediaHTML}
          <div class="post-stats">
            <span>${p.likes} ${p.likes === 1 ? "like" : "likes"}</span>
            <span>${p.comments.length} ${p.comments.length === 1 ? "comment" : "comments"}</span>
          </div>
          <div class="post-actions">
            <button class="action-btn ${p.liked ? "liked" : ""}" onclick="toggleLike(${p.id})">
              ${p.liked ? "❤️ Liked" : "🤍 Like"}
            </button>
            <button class="action-btn" onclick="toggleComments(${p.id})">💬 Comment</button>
            <button class="action-btn ${p.saved ? "saved" : ""}" onclick="toggleSave(${p.id})">
              ${p.saved ? "🔖 Saved" : "📑 Save"}
            </button>
          </div>
          <div class="comments-box" id="comments-${p.id}">
            ${commentsHTML || '<div style="font-size:0.8rem;color:var(--muted);">No comments yet.</div>'}
            <form class="comment-form" onsubmit="addComment(event, ${p.id})">
              <input id="cinput-${p.id}" placeholder="Write a comment..." />
              <button class="post-btn" type="submit" style="padding:6px 14px;">Send</button>
            </form>
          </div>
        </article>
      `;
    }

    function renderFeed() {
      let list = state.posts;
      if (currentFilter === "photos") list = list.filter(p => p.image);
      if (currentFilter === "saved") list = list.filter(p => p.saved);

      document.getElementById("feedContainer").innerHTML = list.length
        ? list.map(buildPostHTML).join("")
        : `<div style="text-align:center;color:var(--muted);padding:30px;">No posts here yet.</div>`;

      const savedList = state.posts.filter(p => p.saved);
      document.getElementById("savedContainer").innerHTML = savedList.length
        ? savedList.map(buildPostHTML).join("")
        : `<div style="text-align:center;color:var(--muted);padding:30px;">Tap Save on any post to bookmark it here.</div>`;
    }

    function renderProfile() {
      const initial = state.profile.name.charAt(0).toUpperCase();
      document.getElementById("composerAvatar").textContent = initial;
      document.getElementById("profileAvatar").textContent = initial;
      document.getElementById("profileDisplayName").textContent = state.profile.name;
      document.getElementById("profileHandle").textContent = state.profile.handle;
      document.getElementById("profileBio").textContent = state.profile.bio;

      document.getElementById("editName").value = state.profile.name;
      document.getElementById("editHandle").value = state.profile.handle;
      document.getElementById("editBio").value = state.profile.bio;

      document.getElementById("statPosts").textContent = state.posts.length;
      document.getElementById("statLikes").textContent = state.posts.reduce((a, b) => a + b.likes, 0);
      document.getElementById("statSaved").textContent = state.posts.filter(p => p.saved).length;
    }

    function saveProfile() {
      const name = document.getElementById("editName").value.trim() || "You";
      let handle = document.getElementById("editHandle").value.trim() || "@you";
      if (!handle.startsWith("@")) handle = "@" + handle;
      const bio = document.getElementById("editBio").value.trim();

      state.profile = { name, handle, bio };
      saveState();
      renderAll();
      switchTab("home");
    }

    function switchTab(tab) {
      ["home", "chats", "saved", "profile"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("nav-" + t).classList.toggle("active", t === tab);
      });
    }

    function renderAll() {
      renderStories();
      renderFeed();
      renderChatList();
      renderChatBadge();
      renderProfile();
    }

    renderAll();
  </script>
</body>
</html>
